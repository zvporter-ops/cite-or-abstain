name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests
        run: PYTHONPATH=. python -m unittest discover -s tests -v
      - name: Import smoke test
        run: |
          python - <<'PY'
          import importlib.util, types, sys
          pkg = types.ModuleType("coa_plugin")
          pkg.__path__ = ["."]
          sys.modules["coa_plugin"] = pkg
          spec = importlib.util.spec_from_file_location("coa_plugin", "__init__.py")
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          assert callable(module.register), "register() missing"
          print("plugin imports and exposes register()")
          PY
